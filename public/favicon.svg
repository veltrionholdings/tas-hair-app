             C 41 24, 43 33, 40 43
             C 37 49, 33 53, 32 58
             C 31 53, 33 47, 34 42
             C 31 47, 28 52, 27 57
             C 26 52, 29 45, 31 40
             C 28 44, 25 48, 24 53
             C 24 47, 28 40, 32 35
             C 31 29, 31 24, 33 19 Z"/>
