<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Purple gradient for the flowing hair strands -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1259"/>
      <stop offset="45%" stop-color="#7B2D8B"/>
      <stop offset="100%" stop-color="#B565C4"/>
    </linearGradient>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2D8B"/>
      <stop offset="100%" stop-color="#4A1259"/>
    </linearGradient>
  </defs>

  <!-- Circular frame -->
  <circle cx="200" cy="200" r="196" fill="#FFFFFF" stroke="#E8E0EA" stroke-width="3"/>

  <!-- Geometric triangular outline (top of mark) -->
  <path d="M 150 90 L 265 90 L 175 205 Z"
        fill="none" stroke="url(#triGrad)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Flowing hair strands cascading down -->
  <g fill="url(#hairGrad)">
    <!-- Main flowing body -->
    <path d="M 205 105
             C 240 130, 250 175, 235 220
             C 225 250, 200 275, 195 305
             C 192 285, 200 255, 205 230
             C 195 250, 180 275, 178 300
             C 176 275, 188 245, 198 220
             C 185 240, 172 260, 170 285
             C 170 255, 185 220, 200 195
             C 195 165, 195 130, 205 105 Z"/>
  </g>

  <!-- Thinner accent strands (lighter) -->
  <g fill="none" stroke="#B565C4" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 210 120 C 235 150, 240 190, 225 230"/>
    <path d="M 200 140 C 190 180, 185 220, 190 260"/>
  </g>

  <!-- Wordmark: TAS HAIR -->
  <text x="200" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#3A3A3A" text-anchor="middle" letter-spacing="2">TAS HAIR</text>
  <!-- Sub text: & Beauty Cafe -->
  <text x="200" y="352" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#7B2D8B" text-anchor="middle" letter-spacing="1">&amp; Beauty Cafe</text>
</svg>
