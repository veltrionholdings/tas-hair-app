<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CCF0"/>
      <stop offset="45%" stop-color="#D8A8E8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
