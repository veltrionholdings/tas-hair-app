<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#7B2D8B"/>

  <!-- Scissors top blade -->
  <g transform="translate(32,32) rotate(-30)">
    <!-- Bottom blade -->
    <ellipse cx="0" cy="8" rx="2.5" ry="10" fill="white" opacity="0.95"/>
    <!-- Top blade -->
    <ellipse cx="0" cy="-8" rx="2.5" ry="10" fill="white" opacity="0.95"/>
    <!-- Pivot circle -->
    <circle cx="0" cy="0" r="3.2" fill="#7B2D8B" stroke="white" stroke-width="1.8"/>
    <!-- Handle loops -->
    <ellipse cx="-1" cy="20" rx="4.5" ry="5.5" fill="none" stroke="white" stroke-width="2.2"/>
    <ellipse cx="1" cy="-20" rx="4.5" ry="5.5" fill="none" stroke="white" stroke-width="2.2"/>
  </g>

  <!-- Decorative dots (sparkle) -->
  <circle cx="50" cy="13" r="2" fill="white" opacity="0.6"/>
  <circle cx="45" cy="8"  r="1.3" fill="white" opacity="0.4"/>
  <circle cx="55" cy="18" r="1.3" fill="white" opacity="0.4"/>
</svg>
